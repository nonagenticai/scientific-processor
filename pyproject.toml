# ==============================================================================
# Scientific Processor - Python Project Configuration
# ==============================================================================

[project]
license = "Apache-2.0"
name = "scientific-processor"
version = "0.1.0"
description = "Scientific data processing, topology analysis, verification, and formal reasoning over knowledge graphs"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "KAG Team" }
]
dependencies = [
    # Core framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Validation & Settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf (CVE) fixed in 2.14.2
    # HTTP client
    "httpx>=0.28.0",
    # Scientific computing
    "networkx>=3.4.0",
    "scipy>=1.14.0",
    "numpy>=2.1.0",
    # Logging & Monitoring
    "structlog>=24.4.0",
    "cachetools>=6.2.4",
    "prometheus-client>=0.21.0",
    # OpenTelemetry instrumentation
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.53b1",
    "opentelemetry-instrumentation-httpx>=0.53b1",
    # Auth
    "PyJWT>=2.15.1",
    "cryptography>=46.0.6",
    # S3/MinIO
    "aioboto3>=13.0.0",
    # Kubernetes
    "kubernetes-asyncio>=31.0.0",
    # Formal verification
    "z3-solver>=4.13.0",
    "sympy>=1.13.0",
    # Shared RLS helper (register_tenant_guc + policy DDL)
    # 0.33.0: kag_common.attribution — caller project/job forwarding.
    "kag-common @ git+https://github.com/nonagenticai/kag_common@v0.37.1",
    # Database (job persistence + verification history)
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.3.0",
    "alembic>=1.15.0",
    # Utilities
    "python-multipart>=0.0.27",
    "python-dotenv>=1.0.1",
    # Security pinned versions
    "urllib3>=2.8.0",  # CVE-2026-44431, CVE-2026-44432 fixed in 2.7.0
    "werkzeug>=3.1.9",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
contract = [
    "schemathesis>=3.36.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "faker>=33.0.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"
filterwarnings = [
    "ignore:coroutine 'SandboxService._poll_job' was never awaited:RuntimeWarning",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may require external services)",
    "security: Security-focused tests",
    "slow: Tests that take longer to run",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "faker>=33.0.0",
    "ruff>=0.15",
    "ty>=0.0.23",
    "detect-secrets>=1.5.0",
]

[tool.coverage.run]
omit = [
    "src/server.py",
    "src/__main__.py",
    "src/telemetry.py",
]

[tool.coverage.report]
fail_under = 85

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["src"]

[tool.ty.rules]
